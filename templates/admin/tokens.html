<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - GoVoting</title>
    <link rel="stylesheet" href="/assets/css/output.css">
</head>
<body class="bg-slate-50 text-slate-900">

<nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center gap-4">
        <a href="/admin/dashboard" class="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition-colors">
            <i data-lucide="arrow-left"></i>
        </a>
        <div>
            <h1 class="text-xl font-black text-indigo-600">Daftar Token Akses</h1>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">{{ .Poll.Title }}</p>
        </div>
    </div>
</nav>

<main class="max-w-6xl mx-auto p-6 md:p-8">
    <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-200">

        <div class="flex justify-between items-center mb-8 pb-6 border-b border-slate-100">
            <div>
                <h2 class="text-2xl font-black">Token Tersedia ({{ len .Poll.Tokens }})</h2>
                <p class="text-slate-500">Bagikan kode unik ini kepada pemilih yang sah.</p>
            </div>
            <button class="flex items-center gap-2 bg-slate-100 text-slate-700 px-4 py-2 rounded-xl font-bold hover:bg-slate-200 transition-colors">
                <i data-lucide="printer" size="18"></i> Cetak PDF
            </button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
            {{ range .Poll.Tokens }}
            {{ if .IsUsed }}
            <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-center opacity-50 relative overflow-hidden">
                <span class="absolute -right-4 -top-4 bg-red-100 text-red-600 text-[10px] font-black px-6 py-1 rotate-45 mt-4">Terpakai</span>
                <code class="font-mono font-bold text-slate-500 text-lg line-through">{{ .TokenString }}</code>
            </div>
            {{ else }}
            <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-xl text-center hover:shadow-md transition-shadow group relative">
                <code class="font-mono font-black text-indigo-700 text-lg">{{ .TokenString }}</code>
                <div class="text-xs text-indigo-400 font-bold mt-1 uppercase tracking-wider">Aktif</div>
            </div>
            {{ end }}
            {{ end }}
        </div>

    </div>
</main>

<script src="/node_modules/lucide/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
