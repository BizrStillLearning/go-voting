<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - GoVoting</title>
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="/node_modules/lucide/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-indigo-100 via-slate-50 to-white min-h-screen flex items-center justify-center p-4">

<div class="relative w-full max-w-md">
    <!-- Dekorasi Latar -->
    <div class="absolute -top-10 -left-10 w-32 h-32 bg-indigo-400 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-pulse"></div>
    <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-blue-400 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-pulse" style="animation-delay: 2s;"></div>

    <!-- Glass Card -->
    <div class="bg-white/60 backdrop-blur-xl p-10 rounded-[2.5rem] shadow-2xl border border-white/50 relative z-10">
        <div class="flex justify-center mb-6">
            <div class="bg-indigo-600 p-3 rounded-2xl text-white shadow-lg shadow-indigo-500/30">
                <i data-lucide="fingerprint" size="32"></i>
            </div>
        </div>
        <h2 class="text-3xl font-black mb-2 text-center text-slate-800">Admin Akses</h2>
        <p class="text-center text-slate-500 font-medium mb-8">Masuk untuk mengelola sistem e-voting.</p>

        {{ if .Error }}
        <div class="bg-red-50 text-red-600 p-4 rounded-2xl mb-6 font-bold text-center border border-red-100 flex items-center justify-center gap-2">
            <i data-lucide="shield-alert" size="18"></i> {{ .Error }}
        </div>
        {{ end }}

        <form action="/login" method="POST" class="space-y-5">
            <div class="space-y-2">
                <label class="text-xs font-black text-slate-500 uppercase tracking-widest ml-1">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" size="18"></i>
                    </div>
                    <input type="text" name="username" required placeholder="admin"
                           class="w-full pl-11 pr-4 py-4 bg-white/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black text-slate-500 uppercase tracking-widest ml-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" size="18"></i>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full pl-11 pr-4 py-4 bg-white/50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium">
                </div>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-indigo-600 text-white py-4 rounded-2xl font-black text-lg mt-4 shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2 group">
                Otorisasi Masuk <i data-lucide="arrow-right" size="18" class="group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>
    </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
