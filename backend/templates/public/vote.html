<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - GoVoting</title>
    <link rel="stylesheet" href="/assets/css/output.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

<div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-xl w-full max-w-2xl border border-slate-200">
    <h1 class="text-3xl md:text-4xl font-black mb-2 text-indigo-900">{{ .Poll.Title }}</h1>
    <p class="text-slate-500 mb-8">{{ .Poll.Description }}</p>

    {{ if .IsClosed }}
    <div class="bg-amber-50 border-2 border-amber-200 text-amber-900 p-8 rounded-[2rem] text-center space-y-4 my-4">
        <div class="inline-flex p-3 bg-amber-100 rounded-full text-amber-700">
            <i data-lucide="lock" size="36"></i>
        </div>
        <h3 class="text-2xl font-black">Voting Telah Ditutup</h3>
        <p class="text-amber-700 font-medium mx-auto">Masa pemilihan untuk polling ini telah berakhir secara resmi atau dihentikan oleh panitia.</p>
        <div class="pt-4">
            <a href="/v/{{ .Poll.Slug }}/results" class="inline-flex items-center gap-2 bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors">
                <i data-lucide="pie-chart" size="18"></i> Lihat Hasil Akhir
            </a>
        </div>
    </div>
    {{ else }}
    <form action="/vote/{{ .Poll.ID }}" method="POST" class="space-y-8">

        <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
            <label class="block font-black text-indigo-900 mb-2 uppercase tracking-wide text-sm">Kode Akses (Token)</label>
            <input type="text" name="token" required placeholder="Contoh: VOTE-X8A9B2"
                   class="w-full p-4 bg-white border border-indigo-200 rounded-xl text-xl font-mono font-bold text-indigo-700 outline-none focus:ring-2 focus:ring-indigo-500 uppercase">
        </div>

        <div class="space-y-4">
            <label class="block font-black text-slate-700 uppercase tracking-wide text-sm">Pilih Salah Satu</label>

            {{ range .Poll.Options }}
            <label class="flex items-center gap-4 p-5 border-2 border-slate-100 rounded-2xl cursor-pointer hover:border-indigo-600 transition-colors has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 group">
                <input type="radio" name="option_id" value="{{ .ID }}" required class="w-6 h-6 text-indigo-600 border-slate-300 focus:ring-indigo-600">
                <span class="text-lg font-bold text-slate-700 group-has-[:checked]:text-indigo-900">{{ .Value }}</span>
            </label>
            {{ end }}
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-black text-xl shadow-lg shadow-indigo-500/30 active:scale-95 transition-all">
            Kirim Suara Saya
        </button>
    </form>
    {{ end }}
</div>

<div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

<script src="/node_modules/lucide/dist/umd/lucide.min.js"></script>
<script>
    lucide.createIcons();

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const errorMsg = params.get('error');

        if (errorMsg) {
            const toast = document.createElement('div');
            toast.className = 'bg-red-500 text-white px-6 py-4 rounded-xl shadow-2xl font-bold flex items-center gap-3 animate-bounce';
            toast.innerHTML = `<i data-lucide="shield-alert"></i> <span>${errorMsg}</span>`;

            document.getElementById('toast-container').appendChild(toast);
            lucide.createIcons();

            window.history.replaceState(null, '', window.location.pathname);

            setTimeout(() => { toast.remove(); }, 4000);
        }
    }
</script>
</body>
</html>
